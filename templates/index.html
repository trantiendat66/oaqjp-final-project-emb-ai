<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Detector</title>
    <script src="./static/mywebscript.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f6fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 600px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 16px;
        }

        .subtitle {
            font-size: 14px;
            color: #4a5568;
            margin-bottom: 18px;
        }

        .label {
            font-size: 14px;
            font-weight: 500;
            color: #2d3748;
            margin-bottom: 8px;
            display: block;
        }

        textarea {
            width: 100%;
            height: 110px;
            padding: 12px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 14px;
            color: #2d3748;
            resize: vertical;
            outline: none;
            margin-bottom: 16px;
            font-family: inherit;
        }

        textarea:focus {
            border-color: #3182ce;
        }

        button {
            background-color: #0b5ed7;
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button:hover {
            background-color: #0a58ca;
        }

        #system_response {
            margin-top: 20px;
            font-size: 14px;
            color: #2d3748;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Emotion Detector</h1>
        <p class="subtitle">Enter an English sentence to analyze its emotions.</p>
        
        <label class="label" for="textToAnalyze">Text to analyze</label>
        <textarea id="textToAnalyze" placeholder="Example: I am very happy today"></textarea>
        
        <div>
            <button onclick="RunSentimentAnalysis()">Analyze Emotion</button>
        </div>

        <div id="system_response"></div>
    </div>

</body>
</html>
